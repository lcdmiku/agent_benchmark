
# Alibaba Cloud Bailian provider
- id: llm-pi-ai
  config:
    providers:
      bailian:
        displayName: Alibaba Cloud Bailian
        apiKeyEnv: BAILIAN_API_KEY
        api: openai-completions

        baseURL: https://llm-c2ps7ivm5gey1xqx.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

        # Qwen OpenAI-compatible API compatibility
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsUsageInStreaming: true
          maxTokensField: max_tokens

        models:
          - id: qwen3.8-max
            name: Qwen3.8 Max
            contextWindow: 1000000

            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: xhigh
              max: xhigh

          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000

            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: xhigh
              max: xhigh

        reasoning: high

# Set DSH default model
- id: agent-default-model
  config:
    provider: bailian
    model: deepseek-v4.1-flash
